<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - PS2 Store</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0b0b10;
            color: white;
            font-family: Arial, sans-serif;
        }

        /* HEADER */
        header {
            background: #11111a;
            border-bottom: 1px solid #29293a;
            padding: 18px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .logo span {
            color: #4f8cff;
        }

        .logout-btn {
            background: #ff5555;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        /* LOGIN */
        .login-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .login-container.show {
            display: flex;
        }

        .login-box {
            background: #15151e;
            padding: 40px;
            border-radius: 15px;
            max-width: 400px;
            border: 1px solid #292934;
        }

        .login-box h2 {
            margin-bottom: 30px;
            text-align: center;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #333344;
            background: #191923;
            color: white;
            border-radius: 8px;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #4f8cff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        /* CONTAINER */
        .container {
            display: none;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .container.show {
            display: block;
        }

        /* TABS */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 1px solid #29293a;
            padding-bottom: 15px;
        }

        .tab-btn {
            background: #181821;
            border: none;
            padding: 10px 20px;
            color: white;
            cursor: pointer;
            border-radius: 8px;
            font-weight: bold;
        }

        .tab-btn.active {
            background: #4f8cff;
        }

        /* CONTENT */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* DASHBOARD */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #15151e;
            border: 1px solid #292934;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card h3 {
            color: #c4c4d0;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
            color: #4f8cff;
        }

        /* TABELAS */
        table {
            width: 100%;
            border-collapse: collapse;
            background: #15151e;
            border-radius: 12px;
            overflow: hidden;
        }

        th {
            background: #1a1a24;
            padding: 15px;
            text-align: left;
            font-weight: bold;
            border-bottom: 1px solid #292934;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #292934;
        }

        tr:hover {
            background: #1a1a24;
        }

        /* BOTÕES */
        .btn {
            background: #4f8cff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-delete {
            background: #ff5555;
        }

        .btn-delete:hover {
            background: #dd3333;
        }

        .btn-primary {
            background: #22a65a;
            margin: 20px 0;
            padding: 12px 24px;
        }

        /* FORMS */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #c4c4d0;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #333344;
            background: #191923;
            color: white;
            border-radius: 6px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* STATUS */
        .status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .status.pago {
            background: #22a65a;
        }

        .status.aguardando {
            background: #f7b731;
            color: black;
        }

        .status.cancelado {
            background: #ff5555;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 50;
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #15151e;
            padding: 40px;
            border-radius: 15px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid #292934;
        }

        .modal-content h2 {
            margin-bottom: 20px;
        }

        .close-btn {
            float: right;
            font-size: 28px;
            cursor: pointer;
            color: #999;
        }

        .close-btn:hover {
            color: white;
        }

        @media(max-width: 700px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 12px;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>

<body>

    <!-- LOGIN -->
    <div id="loginContainer" class="login-container show">
        <div class="login-box">
            <h2>🔐 Admin PS2 Store</h2>
            <input id="username" type="text" placeholder="Usuário" value="admin">
            <input id="password" type="password" placeholder="Senha" value="admin123">
            <button onclick="login()">Entrar</button>
            <p style="text-align: center; margin-top: 20px; font-size: 12px; color: #666;">
                Digite as credenciais do admin
            </p>
        </div>
    </div>

    <!-- ADMIN -->
    <div id="adminContainer" class="container">
        <header>
            <div class="logo">PS2 <span>ADMIN</span></div>
            <button class="logout-btn" onclick="logout()">Sair</button>
        </header>

        <!-- TABS -->
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('dashboard')">📊 Dashboard</button>
            <button class="tab-btn" onclick="showTab('products')">📦 Produtos</button>
            <button class="tab-btn" onclick="showTab('orders')">🛒 Pedidos</button>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard" class="tab-content active">
            <h2>📊 Dashboard</h2>
            <div class="stats" id="statsContainer"></div>
        </div>

        <!-- PRODUTOS -->
        <div id="products" class="tab-content">
            <h2>📦 Produtos</h2>
            <button class="btn-primary" onclick="showProductForm()">➕ Novo Produto</button>
            <table id="productsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Gênero</th>
                        <th>Preço</th>
                        <th>Estoque</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="productsBody"></tbody>
            </table>
        </div>

        <!-- PEDIDOS -->
        <div id="orders" class="tab-content">
            <h2>🛒 Pedidos</h2>
            <table id="ordersTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Data</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="ordersBody"></tbody>
            </table>
        </div>
    </div>

    <!-- MODAL PRODUTO -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeProductForm()">&times;</span>
            <h2>Produto</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>Nome</label>
                    <input id="productName" type="text">
                </div>
                <div class="form-group">
                    <label>Gênero</label>
                    <input id="productGenre" type="text">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Preço</label>
                    <input id="productPrice" type="number" step="0.01">
                </div>
                <div class="form-group">
                    <label>Estoque</label>
                    <input id="productStock" type="number">
                </div>
            </div>
            <div class="form-group">
                <label>Imagem URL</label>
                <input id="productImage" type="text">
            </div>
            <div class="form-group">
                <label>Descrição</label>
                <textarea id="productDescription" rows="3"></textarea>
            </div>
            <button class="btn-primary" onclick="saveProduct()">Salvar</button>
        </div>
    </div>

    <!-- MODAL PEDIDO -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeOrderDetails()">&times;</span>
            <h2>Detalhes do Pedido</h2>
            <div id="orderDetails"></div>
            <div class="form-group">
                <label>Status</label>
                <select id="orderStatus">
                    <option value="aguardando_pagamento">Aguardando Pagamento</option>
                    <option value="pago">Pago</option>
                    <option value="cancelado">Cancelado</option>
                </select>
            </div>
            <button class="btn-primary" onclick="updateOrderStatus()">Atualizar</button>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';
        let token = localStorage.getItem('token');
        let currentProductId = null;
        let currentOrderId = null;

        // ==========================================
        // LOGIN
        // ==========================================

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_URL}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.token) {
                    token = data.token;
                    localStorage.setItem('token', token);
                    document.getElementById('loginContainer').classList.remove('show');
                    document.getElementById('adminContainer').classList.add('show');
                    loadDashboard();
                } else {
                    alert('Usuário ou senha inválidos');
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao fazer login');
            }
        }

        function logout() {
            token = null;
            localStorage.removeItem('token');
            document.getElementById('loginContainer').classList.add('show');
            document.getElementById('adminContainer').classList.remove('show');
        }

        // ==========================================
        // TABS
        // ==========================================

        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'products') loadProducts();
            if (tabName === 'orders') loadOrders();
            if (tabName === 'dashboard') loadDashboard();
        }

        // ==========================================
        // DASHBOARD
        // ==========================================

        async function loadDashboard() {
            try {
                const response = await fetch(`${API_URL}/api/admin/stats`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const stats = await response.json();

                const html = `
                    <div class="stat-card">
                        <h3>Total de Pedidos</h3>
                        <div class="number">${stats.totalOrders}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Pedidos Pagos</h3>
                        <div class="number">${stats.paidOrders}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Pendentes</h3>
                        <div class="number">${stats.pendingOrders}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Faturamento Total</h3>
                        <div class="number">R$ ${stats.totalRevenue.toFixed(2).replace('.', ',')}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Total de Produtos</h3>
                        <div class="number">${stats.totalProducts}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Estoque Total</h3>
                        <div class="number">${stats.totalStock}</div>
                    </div>
                `;

                document.getElementById('statsContainer').innerHTML = html;
            } catch (error) {
                console.error('Erro:', error);
            }
        }

        // ==========================================
        // PRODUTOS
        // ==========================================

        async function loadProducts() {
            try {
                const response = await fetch(`${API_URL}/api/products`);
                const products = await response.json();

                let html = '';
                products.forEach(product => {
                    html += `
                        <tr>
                            <td>${product.id}</td>
                            <td>${product.name}</td>
                            <td>${product.genre}</td>
                            <td>R$ ${product.price.toFixed(2).replace('.', ',')}</td>
                            <td>${product.stock}</td>
                            <td>
                                <button class="btn" onclick="editProduct(${product.id})">Editar</button>
                                <button class="btn btn-delete" onclick="deleteProduct(${product.id})">Deletar</button>
                            </td>
                        </tr>
                    `;
                });

                document.getElementById('productsBody').innerHTML = html;
            } catch (error) {
                console.error('Erro:', error);
            }
        }

        function showProductForm() {
            currentProductId = null;
            document.getElementById('productName').value = '';
            document.getElementById('productGenre').value = '';
            document.getElementById('productPrice').value = '';
            document.getElementById('productStock').value = '';
            document.getElementById('productImage').value = '';
            document.getElementById('productDescription').value = '';
            document.getElementById('productModal').classList.add('show');
        }

        function closeProductForm() {
            document.getElementById('productModal').classList.remove('show');
        }

        async function editProduct(id) {
            try {
                const response = await fetch(`${API_URL}/api/products/${id}`);
                const product = await response.json();

                currentProductId = id;
                document.getElementById('productName').value = product.name;
                document.getElementById('productGenre').value = product.genre;
                document.getElementById('productPrice').value = product.price;
                document.getElementById('productStock').value = product.stock;
                document.getElementById('productImage').value = product.image;
                document.getElementById('productDescription').value = product.description;
                document.getElementById('productModal').classList.add('show');
            } catch (error) {
                console.error('Erro:', error);
            }
        }

        async function saveProduct() {
            const data = {
                name: document.getElementById('productName').value,
                genre: document.getElementById('productGenre').value,
                price: document.getElementById('productPrice').value,
                stock: document.getElementById('productStock').value,
                image: document.getElementById('productImage').value,
                description: document.getElementById('productDescription').value,
                rating: 5
            };

            try {
                const method = currentProductId ? 'PUT' : 'POST';
                const url = currentProductId 
                    ? `${API_URL}/api/admin/products/${currentProductId}`
                    : `${API_URL}/api/admin/products`;

                const response = await fetch(url, {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    alert('Produto salvo com sucesso!');
                    closeProductForm();
                    loadProducts();
                } else {
                    alert('Erro ao salvar produto');
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao salvar produto');
            }
        }

        async function deleteProduct(id) {
            if (!confirm('Tem certeza?')) return;

            try {
                const response = await fetch(`${API_URL}/api/admin/products/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    alert('Produto deletado!');
                    loadProducts();
                }
            } catch (error) {
                console.error('Erro:', error);
            }
        }

        // ==========================================
        // PEDIDOS
        // ==========================================

        async function loadOrders() {
            try {
                const response = await fetch(`${API_URL}/api/admin/orders`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const orders = await response.json();

                let html = '';
                orders.forEach(order => {
                    const statusClass = order.status === 'pago' ? 'pago' : order.status === 'cancelado' ? 'cancelado' : 'aguardando';
                    html += `
                        <tr>
                            <td>${order.id}</td>
                            <td>R$ ${order.total.toFixed(2).replace('.', ',')}</td>
                            <td><span class="status ${statusClass}">${order.status}</span></td>
                            <td>${new Date(order.createdAt).toLocaleDateString()}</td>
                            <td>
                                <button class="btn" onclick="viewOrder('${order.id}')">Ver</button>
                            </td>
                        </tr>
                    `;
                });

                document.getElementById('ordersBody').innerHTML = html;
            } catch (error) {
                console.error('Erro:', error);
            }
        }

        async function viewOrder(id) {
            try {
                const response = await fetch(`${API_URL}/api/admin/orders/${id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const order = await response.json();
                currentOrderId = id;

                let itemsHtml = '<ul>';
                order.items.forEach(item => {
                    itemsHtml += `<li>${item.name} - R$ ${item.price.toFixed(2).replace('.', ',')}</li>`;
                });
                itemsHtml += '</ul>';

                document.getElementById('orderDetails').innerHTML = `
                    <p><strong>ID:</strong> ${order.id}</p>
                    <p><strong>Total:</strong> R$ ${order.total.toFixed(2).replace('.', ',')}</p>
                    <p><strong>Status Atual:</strong> ${order.status}</p>
                    <p><strong>Data:</strong> ${new Date(order.createdAt).toLocaleDateString()}</p>
                    <p><strong>Itens:</strong></p>
                    ${itemsHtml}
                `;

                document.getElementById('orderStatus').value = order.status;
                document.getElementById('orderModal').classList.add('show');
            } catch (error) {
                console.error('Erro:', error);
            }
        }

        function closeOrderDetails() {
            document.getElementById('orderModal').classList.remove('show');
        }

        async function updateOrderStatus() {
            try {
                const status = document.getElementById('orderStatus').value;
                const response = await fetch(`${API_URL}/api/admin/orders/${currentOrderId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ status })
                });

                if (response.ok) {
                    alert('Pedido atualizado!');
                    closeOrderDetails();
                    loadOrders();
                }
            } catch (error) {
                console.error('Erro:', error);
            }
        }

        // ==========================================
        // INICIALIZAR
        // ==========================================

        if (token) {
            document.getElementById('loginContainer').classList.remove('show');
            document.getElementById('adminContainer').classList.add('show');
            loadDashboard();
        }
    </script>

</body>

</html>
